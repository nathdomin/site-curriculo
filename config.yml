backend:
  name: git-gateway
  branch: main

# Onde as imagens enviadas pelo painel serão salvas
media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "curriculo"
    label: "Currículo"
    files:
      - file: "content/cv.json"
        label: "Dados do Currículo"
        name: "cv"
        fields:
          - { label: "Título da Aba do Navegador", name: "meta_title", widget: "string" }
          - { label: "Descrição (SEO)", name: "meta_description", widget: "text" }

          - label: "Topo (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Texto de Saudação", name: "subtitle", widget: "string" }
              - { label: "Nome - Linha 1", name: "name_line1", widget: "string" }
              - { label: "Nome - Linha 2", name: "name_line2", widget: "string" }
              - { label: "Profissão / Área", name: "profession", widget: "string" }
              - { label: "Descrição Curta", name: "description", widget: "text" }
              - { label: "Texto do Botão", name: "cta_text", widget: "string" }
              - { label: "Foto de Perfil", name: "photo", widget: "image" }

          - label: "Sobre Mim"
            name: "about"
            widget: "object"
            fields:
              - { label: "Texto Sobre Mim", name: "description", widget: "text" }
              - label: "Caixas de Destaque"
                name: "info_boxes"
                widget: "list"
                summary: "{{title}} - {{subtitle}}"
                fields:
                  - { label: "Ícone (nome Phosphor Icons)", name: "icon", widget: "string", hint: "Ex: ph-map-pin, ph-briefcase, ph-robot. Veja nomes em phosphoricons.com" }
                  - { label: "Título", name: "title", widget: "string" }
                  - { label: "Subtítulo", name: "subtitle", widget: "string" }

          - label: "Experiência Profissional"
            name: "experience"
            widget: "list"
            summary: "{{title}} - {{company}}"
            fields:
              - { label: "Período", name: "date", widget: "string" }
              - { label: "Cargo", name: "title", widget: "string" }
              - { label: "Empresa | Cidade", name: "company", widget: "string" }
              - { label: "Descrição", name: "description", widget: "text" }

          - label: "Formação Acadêmica"
            name: "education"
            widget: "list"
            summary: "{{title}} - {{company}}"
            fields:
              - { label: "Período", name: "date", widget: "string" }
              - { label: "Curso / Etapa", name: "title", widget: "string" }
              - { label: "Instituição | Cidade", name: "company", widget: "string" }
              - { label: "Descrição", name: "description", widget: "text" }

          - label: "Competências"
            name: "skills"
            widget: "object"
            fields:
              - label: "Comportamentais"
                name: "behavioral"
                widget: "list"
                allow_add: true
              - label: "Técnicas & Ferramentas"
                name: "technical"
                widget: "list"
                allow_add: true
              - label: "Cursos Extras"
                name: "courses"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Período", name: "date", widget: "string" }
                  - { label: "Nome do Curso", name: "title", widget: "string" }
                  - { label: "Instituição", name: "institution", widget: "string" }

          - label: "Projetos"
            name: "projects"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Nome do Projeto", name: "title", widget: "string" }
              - { label: "Descrição", name: "description", widget: "text", required: false }
              - { label: "Link do Projeto", name: "link", widget: "string", hint: "Ex: https://github.com/seu-usuario/projeto" }
              - { label: "Foto/Print do Projeto", name: "image", widget: "image", required: false }

          - label: "Contato"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "LinkedIn - Texto Exibido", name: "linkedin_label", widget: "string" }
              - { label: "LinkedIn - Link do Perfil", name: "linkedin_url", widget: "string" }
              - { label: "WhatsApp - Texto Exibido", name: "whatsapp_label", widget: "string" }
              - { label: "WhatsApp - Link (wa.me/55...)", name: "whatsapp_url", widget: "string" }
              - { label: "GitHub - Texto Exibido", name: "github_label", widget: "string" }
              - { label: "GitHub - Link do Perfil", name: "github_url", widget: "string" }
              - { label: "Arquivo PDF do Currículo", name: "cv_pdf", widget: "file", media_folder: "/", public_folder: "/" }
